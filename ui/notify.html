<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; }
  .card { margin: 8px; padding: 11px 14px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: var(--shadow); display: flex; gap: 11px; align-items: flex-start; opacity: 0; transform: translateY(-6px); transition: opacity .18s ease-out, transform .18s ease-out; }
  .card.in { opacity: 1; transform: none; }
  html[data-solid] .card { box-shadow: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--on-accent); }
  .body { min-width: 0; flex: 1; }
  .name { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .name .more { font-weight: 600; font-size: 11px; color: var(--dim); background: var(--panel-2); border-radius: 999px; padding: 1px 7px; }
  .text { margin-top: 2px; color: var(--text); white-space: pre-wrap; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .text.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--dim); }
  .text.hidden-text { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="avatar" id="avatar"></div>
  <div class="body"><div class="name"><span id="name"></span><span class="more" id="more" hidden></span></div><div class="text" id="text"></div></div>
</div>
<script src="notify.js"></script>
</body>
</html>
